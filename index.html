<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دليل كلية الطب | منصة رفيق الدكاترة 🩺</title>

  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="theme-color" content="#030712">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%236366f1'/%3E%3Cstop offset='100%25' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='28' fill='url(%23g)'/%3E%3Cpath d='M20 52h14l6-16 10 32 9-22 7 8h14' stroke='%23ffffff' stroke-width='6.5' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">

  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-main: #030712;
      --bg-card: rgba(11, 19, 38, 0.78);
      --border-glow: rgba(255, 255, 255, 0.08);
      --border-glow-hover: rgba(6, 182, 212, 0.5);
      
      --cyan-glow: #06b6d4;
      --indigo-glow: #6366f1;
      --emerald-glow: #10b981;
      --rose-glow: #f43f5e;
      --amber-glow: #f59e0b;

      --text-white: #f8fafc;
      --text-dim: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      background-image: 
        radial-gradient(at 15% 15%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 85% 85%, rgba(6, 182, 212, 0.15) 0px, transparent 50%);
      background-attachment: fixed;
      background-size: 200% 200%;
      animation: bgMorph 18s ease infinite alternate;
      color: var(--text-white);
      min-height: 100vh;
      padding-bottom: 60px;
      overflow-x: hidden;
      position: relative;
    }

    @keyframes bgMorph {
      0% { background-position: 0% 0%; }
      100% { background-position: 100% 100%; }
    }

    .ambient-glow {
      position: fixed;
      width: 350px;
      height: 350px;
      border-radius: 50%;
      filter: blur(80px);
      z-index: -1;
      opacity: 0.2;
      pointer-events: none;
    }
    .orb-1 { top: -100px; right: -100px; background: var(--indigo-glow); }
    .orb-2 { bottom: -100px; left: -100px; background: var(--cyan-glow); }

    .app-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 16px;
      position: relative;
      z-index: 1;
    }

    .glass-panel {
      background: var(--bg-card);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid var(--border-glow);
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .glass-panel:hover {
      border-color: var(--border-glow-hover);
      box-shadow: 0 20px 45px rgba(6, 182, 212, 0.2);
      transform: translateY(-2px);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(3, 7, 18, 0.85);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-bottom: 1px solid var(--border-glow);
      padding: 14px 0;
      margin-bottom: 24px;
    }

    .header-wrapper {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .header-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .user-greeting {
      font-size: 1.05rem;
      font-weight: 800;
      color: #fff;
    }

    .profile-pill {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-glow);
      padding: 6px 14px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 0.78rem;
      transition: all 0.25s;
    }
    .profile-pill:hover { border-color: var(--cyan-glow); background: rgba(255,255,255,0.08); }

    .group-tag {
      background: var(--cyan-glow);
      color: #030712;
      padding: 2px 9px;
      border-radius: 10px;
      font-weight: 800;
    }

    .header-bottom-row {
      width: 100%;
      display: flex;
      gap: 8px;
    }

    .nav-sched-btn, .nav-tasks-btn, .nav-exams-btn {
      flex: 1;
      background: linear-gradient(135deg, var(--indigo-glow), var(--cyan-glow));
      color: #fff;
      border: none;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 0.82rem;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 18px rgba(99, 102, 241, 0.35);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .nav-tasks-btn {
      background: linear-gradient(135deg, var(--emerald-glow), var(--cyan-glow));
      color: #030712;
      box-shadow: 0 4px 18px rgba(16, 185, 129, 0.35);
    }
    .nav-exams-btn {
      background: linear-gradient(135deg, var(--amber-glow), var(--rose-glow));
      color: #fff;
      box-shadow: 0 4px 18px rgba(245, 158, 11, 0.35);
    }
    .nav-sched-btn:hover, .nav-tasks-btn:hover, .nav-exams-btn:hover { transform: translateY(-2px); }

    .feedback-trigger-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-glow);
      color: #fff;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.3s;
    }
    .feedback-trigger-btn:hover { border-color: var(--cyan-glow); background: rgba(255,255,255,0.09); }

    .view-selector {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    .view-btn {
      flex: 1;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid var(--border-glow);
      background: rgba(255, 255, 255, 0.02);
      color: var(--text-dim);
      font-size: 0.88rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .view-btn:hover { background: rgba(255,255,255,0.06); color: #fff; }

    .view-btn.active {
      background: linear-gradient(135deg, var(--indigo-glow), var(--cyan-glow));
      color: #fff;
      border-color: transparent;
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.35);
    }

    .view-btn.exams-mode.active {
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.35);
    }

    .section-header-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .info-guide-btn {
      background: rgba(6, 182, 212, 0.12);
      border: 1px solid var(--cyan-glow);
      color: var(--cyan-glow);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .info-guide-btn:hover { background: var(--cyan-glow); color: #030712; transform: scale(1.1); }

    .next-widget {
      padding: 22px;
      margin-bottom: 18px;
      border: 1px solid rgba(6, 182, 212, 0.35);
    }

    .widget-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .widget-badge {
      font-size: 0.75rem;
      font-weight: 800;
      background: rgba(6, 182, 212, 0.15);
      color: var(--cyan-glow);
      border: 1px solid var(--cyan-glow);
      padding: 4px 12px;
      border-radius: 20px;
    }

    .countdown-box {
      font-size: 0.8rem;
      font-weight: 800;
      background: rgba(0, 0, 0, 0.4);
      padding: 5px 14px;
      border-radius: 14px;
      color: var(--cyan-glow);
    }

    .widget-title {
      font-size: 1.1rem;
      font-weight: 900;
      margin-bottom: 14px;
      color: #fff;
    }

    .widget-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
      gap: 10px;
      background: rgba(0, 0, 0, 0.3);
      padding: 14px;
      border-radius: 14px;
      margin-bottom: 14px;
    }

    .w-item { font-size: 0.8rem; }
    .w-label { color: var(--text-dim); display: block; font-size: 0.68rem; font-weight: 800; text-transform: uppercase; }
    .w-val { font-weight: 800; color: #f1f5f9; }

    .nav-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 14px;
      scrollbar-width: none;
    }
    .nav-scroll::-webkit-scrollbar { display: none; }

    .nav-chip {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-glow);
      color: var(--text-dim);
      padding: 9px 16px;
      border-radius: 14px;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .nav-chip:hover { background: rgba(255,255,255,0.08); color: #fff; }
    .nav-chip.active {
      background: var(--cyan-glow);
      color: #030712;
      border-color: transparent;
      font-weight: 900;
      box-shadow: 0 4px 15px rgba(6, 182, 212, 0.4);
    }

    .search-box {
      position: relative;
      margin-bottom: 18px;
    }
    .search-box i {
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
    }
    .search-input {
      width: 100%;
      background: rgba(11, 19, 38, 0.9);
      border: 1px solid var(--border-glow);
      padding: 12px 42px 12px 16px;
      border-radius: 14px;
      color: #fff;
      font-size: 0.88rem;
      outline: none;
      transition: all 0.3s;
    }
    .search-input:focus { border-color: var(--cyan-glow); box-shadow: 0 0 15px rgba(6,182,212,0.25); }

    .timeline-card {
      padding: 18px;
      margin-bottom: 14px;
      animation: fadeInCard 0.35s ease;
    }
    @keyframes fadeInCard {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .subject-tag {
      padding: 3px 12px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 900;
      color: #fff;
    }
    .anatomy { background: #f97316; }
    .biochem { background: #10b981; }
    .physio { background: #06b6d4; }
    .histo { background: #a855f7; }
    .prof { background: #ec4899; }
    .exam { background: #f59e0b; }

    .card-title {
      font-size: 1.02rem;
      font-weight: 900;
      margin-bottom: 12px;
      color: #fff;
    }

    .card-details {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      background: rgba(0, 0, 0, 0.3);
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.82rem;
      color: var(--text-dim);
    }
    .card-details span { color: #f1f5f9; font-weight: 700; }

    /* الأقسام المنفصلة */
    .sub-page-view { display: none; }

    .sub-page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-glow);
      color: #fff;
      padding: 9px 16px;
      border-radius: 12px;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.3s;
    }
    .back-btn:hover { border-color: var(--cyan-glow); background: rgba(255,255,255,0.09); }

    .task-row-card {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 14px 18px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      transition: all 0.3s;
    }
    .task-row-card:hover { border-color: rgba(16, 185, 129, 0.4); transform: translateY(-2px); }

    .task-content {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
    }
    .task-checkbox {
      width: 20px;
      height: 20px;
      accent-color: var(--emerald-glow);
      cursor: pointer;
    }
    .task-title-text {
      font-size: 0.92rem;
      font-weight: 800;
      color: #e2e8f0;
    }
    .task-title-text.done {
      text-decoration: line-through;
      color: var(--text-dim);
    }
    .task-meta-badge {
      background: rgba(16, 185, 129, 0.15);
      color: var(--emerald-glow);
      border: 1px solid rgba(16, 185, 129, 0.3);
      font-size: 0.72rem;
      padding: 2px 10px;
      border-radius: 8px;
      font-weight: 800;
      margin-right: 10px;
    }

    .custom-dropdown-container {
      position: relative;
      user-select: none;
    }
    .custom-dropdown-trigger {
      background: rgba(11, 19, 38, 0.9);
      border: 1px solid var(--border-glow);
      padding: 11px 14px;
      border-radius: 12px;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s;
    }
    .custom-dropdown-trigger:hover { border-color: var(--cyan-glow); }
    .custom-dropdown-menu {
      position: absolute;
      bottom: 100%;
      left: 0; right: 0;
      background: #0b1326;
      border: 1px solid rgba(6, 182, 212, 0.4);
      border-radius: 14px;
      margin-bottom: 6px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      display: none;
      z-index: 50;
      max-height: 200px;
      overflow-y: auto;
    }
    .custom-dropdown-item {
      padding: 10px 14px;
      font-size: 0.82rem;
      font-weight: 700;
      color: #cbd5e1;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .custom-dropdown-item:hover { background: rgba(6, 182, 212, 0.15); color: #fff; }

    .groups-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }
    .group-pill-option {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-glow);
      padding: 10px;
      border-radius: 12px;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 900;
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.3s;
    }
    .group-pill-option:hover { border-color: var(--cyan-glow); color: #fff; }
    .group-pill-option.selected {
      background: var(--cyan-glow);
      color: #030712;
      border-color: transparent;
      box-shadow: 0 4px 15px rgba(6, 182, 212, 0.4);
    }

    .add-task-form-box {
      background: rgba(0, 0, 0, 0.3);
      padding: 16px;
      border-radius: 16px;
      margin-top: 16px;
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 10px;
    }
    @media(max-width: 750px) {
      .add-task-form-box { grid-template-columns: 1fr; }
    }

    .form-ctrl {
      background: rgba(11, 19, 38, 0.9);
      border: 1px solid var(--border-glow);
      padding: 11px 14px;
      border-radius: 12px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
      transition: all 0.3s;
    }
    .form-ctrl:focus { border-color: var(--emerald-glow); }

    .btn-primary {
      background: linear-gradient(135deg, var(--emerald-glow), var(--cyan-glow));
      color: #030712;
      border: none;
      padding: 11px 20px;
      border-radius: 12px;
      font-weight: 900;
      font-size: 0.85rem;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(16, 185, 129, 0.35);
      transition: all 0.3s;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 22px rgba(16, 185, 129, 0.5); }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(3, 7, 18, 0.9);
      backdrop-filter: blur(15px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-card { max-width: 440px; width: 100%; padding: 28px; }

    /* تنسيقات الامتحانات */
    .exam-module-header {
      font-size: 1.1rem;
      font-weight: 900;
      color: var(--cyan-glow);
      margin: 20px 0 10px 0;
      border-bottom: 1px solid var(--border-glow);
      padding-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .exams-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }
    .exam-card {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-glow);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.3s;
    }
    .exam-card:hover { border-color: var(--cyan-glow); transform: translateY(-2px); }

    .exam-status-badge {
      font-size: 0.72rem;
      padding: 3px 10px;
      border-radius: 10px;
      font-weight: 800;
      display: inline-block;
      margin-top: 6px;
    }
    .status-unattempted { background: rgba(148, 163, 184, 0.15); color: var(--text-dim); border: 1px dashed var(--text-dim); }
    .status-passed { background: rgba(16, 185, 129, 0.2); color: var(--emerald-glow); border: 1px solid rgba(16, 185, 129, 0.4); }
    .status-failed { background: rgba(245, 158, 11, 0.2); color: var(--amber-glow); border: 1px solid rgba(245, 158, 11, 0.4); }

    footer {
      margin-top: 50px;
      text-align: center;
      font-size: 0.82rem;
      color: var(--text-dim);
      border-top: 1px solid var(--border-glow);
      padding-top: 20px;
    }
    .developer-credit {
      color: var(--cyan-glow);
      font-weight: 900;
      text-decoration: none;
      transition: all 0.3s;
    }
    .developer-credit:hover { color: #fff; text-shadow: 0 0 12px var(--cyan-glow); }
  </style>
</head>
<body>

  <div class="ambient-glow orb-1"></div>
  <div class="ambient-glow orb-2"></div>

  <!-- Modal تسجيل الدخول -->
  <div id="loginModal" class="modal-backdrop" style="display: flex;">
    <div class="modal-card glass-panel" style="text-align: center;">
      <div style="width: 48px; height: 48px; border-radius: 16px; background: linear-gradient(135deg, var(--indigo-glow), var(--cyan-glow)); display: flex; align-items: center; justify-content: center; font-size: 20px; color: #fff; margin: 0 auto 16px;">🩺</div>
      <h2 style="font-size: 1.25rem; font-weight: 900; margin-bottom: 6px;">مرحباً بك يا دكتور</h2>
      <p style="font-size: 0.8rem; color: var(--text-dim); margin-bottom: 18px;">اختر مجموعتك الفرعية واكتب اسمك للبدء</p>

      <div style="text-align: right; margin-bottom: 14px;">
        <label style="font-size: 0.78rem; color: var(--text-dim); font-weight: 800; display: block; margin-bottom: 6px;">الاسم الكريم:</label>
        <input type="text" id="modalNameInput" class="search-input" placeholder="مثال: د. أحمد...">
      </div>

      <div style="text-align: right; margin-bottom: 20px;">
        <label style="font-size: 0.78rem; color: var(--text-dim); font-weight: 800; display: block; margin-bottom: 6px;">اختر مجموعتك الفرعية (Subgroup):</label>
        <div class="groups-grid" id="loginGroupsGrid">
          <div class="group-pill-option" onclick="selectLoginGroup('A1')">A1</div>
          <div class="group-pill-option" onclick="selectLoginGroup('A2')">A2</div>
