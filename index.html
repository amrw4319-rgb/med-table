  <style>
    :root {
      --bg-main: #030712;
      --bg-card: rgba(11, 19, 38, 0.78);
      --border-glow: rgba(255, 255, 255, 0.08);
      --border-glow-hover: rgba(6, 182, 212, 0.5);
      
      --cyan-glow: #06b6d4;
      --indigo-glow: #6366f1;
      --emerald-glow: #10b981;
      --rose-glow: #f43f5e;
      --amber-glow: #f59e0b;

      --text-white: #f8fafc;
      --text-dim: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      background-image: 
        radial-gradient(at 15% 15%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 85% 85%, rgba(6, 182, 212, 0.15) 0px, transparent 50%);
      background-attachment: fixed;
      background-size: 200% 200%;
      animation: bgMorph 18s ease infinite alternate;
      color: var(--text-white);
      min-height: 100vh;
      padding-bottom: 60px;
      overflow-x: hidden;
      position: relative;
    }

    @keyframes bgMorph {
      0% { background-position: 0% 0%; }
      100% { background-position: 100% 100%; }
    }

    .ambient-glow {
      position: fixed;
      width: 350px;
      height: 350px;
      border-radius: 50%;
      filter: blur(80px);
      z-index: -1;
      opacity: 0.2;
      pointer-events: none;
    }
    .orb-1 { top: -100px; right: -100px; background: var(--indigo-glow); }
    .orb-2 { bottom: -100px; left: -100px; background: var(--cyan-glow); }

    .app-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 16px;
      position: relative;
      z-index: 1;
    }

    .glass-panel {
      background: var(--bg-card);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid var(--border-glow);
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .glass-panel:hover {
      border-color: var(--border-glow-hover);
      box-shadow: 0 20px 45px rgba(6, 182, 212, 0.2);
      transform: translateY(-2px);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(3, 7, 18, 0.85);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-bottom: 1px solid var(--border-glow);
      padding: 14px 0;
      margin-bottom: 24px;
    }

    .header-wrapper {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .header-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .user-greeting {
      font-size: 1.05rem;
      font-weight: 800;
      color: #fff;
    }

    .profile-pill {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-glow);
      padding: 6px 14px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 0.78rem;
      transition: all 0.25s;
    }
    .profile-pill:hover { border-color: var(--cyan-glow); background: rgba(255,255,255,0.08); }

    .group-tag {
      background: var(--cyan-glow);
      color: #030712;
      padding: 2px 9px;
      border-radius: 10px;
      font-weight: 800;
    }

    .header-bottom-row {
      width: 100%;
      display: flex;
      gap: 10px;
    }

    .nav-tasks-btn {
      flex: 1;
      background: linear-gradient(135deg, var(--emerald-glow), var(--cyan-glow));
      color: #030712;
      border: none;
      padding: 11px 18px;
      border-radius: 14px;
      font-size: 0.85rem;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 18px rgba(16, 185, 129, 0.35);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .nav-tasks-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 22px rgba(6, 182, 212, 0.5); }

    .feedback-trigger-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-glow);
      color: #fff;
      padding: 11px 16px;
      border-radius: 14px;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.3s;
    }
    .feedback-trigger-btn:hover { border-color: var(--cyan-glow); background: rgba(255,255,255,0.09); }

    .view-selector {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    .view-btn {
      flex: 1;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid var(--border-glow);
      background: rgba(255, 255, 255, 0.02);
      color: var(--text-dim);
      font-size: 0.88rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .view-btn:hover { background: rgba(255,255,255,0.06); color: #fff; }

    .view-btn.active {
      background: linear-gradient(135deg, var(--indigo-glow), var(--cyan-glow));
      color: #fff;
      border-color: transparent;
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.35);
    }

    .view-btn.exams-mode.active {
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.35);
    }

    .section-header-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .info-guide-btn {
      background: rgba(6, 182, 212, 0.12);
      border: 1px solid var(--cyan-glow);
      color: var(--cyan-glow);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: inline-flex;
